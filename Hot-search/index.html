<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日热搜 · 三分钟看尽人间事</title>
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>

  <!-- 两侧国风装饰（与热点速览页共用同一套，保持整体感） -->
  <aside class="side-deco side-left" aria-hidden="true">
    <div class="deco-fret"></div>
    <div class="deco-plum">
      <svg viewBox="0 0 92 76" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 72 C22 62 30 48 34 32 C36 24 40 18 48 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M30 44 C40 40 50 42 58 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M40 22 C46 14 56 10 66 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <g stroke="currentColor" stroke-width="1.1" fill="none">
          <circle cx="48" cy="12" r="2.6"/><circle cx="53.2" cy="15.8" r="2.6"/>
          <circle cx="51.2" cy="22" r="2.6"/><circle cx="44.8" cy="22" r="2.6"/>
          <circle cx="42.8" cy="15.8" r="2.6"/><circle cx="48" cy="17" r="1.5" fill="currentColor"/>
          <circle cx="62" cy="44" r="2.3"/><circle cx="66.5" cy="47.4" r="2.3"/>
          <circle cx="64.8" cy="52.8" r="2.3"/><circle cx="59.2" cy="52.8" r="2.3"/>
          <circle cx="57.5" cy="47.4" r="2.3"/><circle cx="62" cy="48.5" r="1.3" fill="currentColor"/>
        </g>
      </svg>
    </div>
    <div class="deco-bamboo">
      <svg viewBox="0 0 60 150" xmlns="http://www.w3.org/2000/svg">
        <line x1="30" y1="0" x2="30" y2="150" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="22" y1="34" x2="38" y2="34" stroke="currentColor" stroke-width="1.6"/>
        <line x1="22" y1="82" x2="38" y2="82" stroke="currentColor" stroke-width="1.6"/>
        <line x1="22" y1="128" x2="38" y2="128" stroke="currentColor" stroke-width="1.6"/>
        <path d="M30 40 C42 34 52 38 58 46 C46 52 34 50 30 40 Z" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M30 88 C18 82 8 86 2 94 C14 100 26 98 30 88 Z" fill="none" stroke="currentColor" stroke-width="1.3"/>
      </svg>
    </div>
    <div class="deco-verse">
      <span>人</span><span>间</span><span>烟</span><span>火</span><span>气</span>
      <i class="deco-dot"></i>
      <span>最</span><span>抚</span><span>凡</span><span>人</span><span>心</span>
    </div>
    <div class="deco-wave">
      <svg viewBox="0 0 90 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 8 Q12 2 22 8 T42 8 T62 8 T82 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M2 18 Q12 12 22 18 T42 18 T62 18 T82 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>
  </aside>

  <aside class="side-deco side-right" aria-hidden="true">
    <div class="deco-fret"></div>
    <div class="deco-orchid">
      <svg viewBox="0 0 90 80" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 76 C18 50 26 28 24 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M12 76 C28 58 44 44 72 40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M12 76 C30 62 52 56 84 62" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M16 70 C22 52 28 40 34 30" fill="none" stroke="currentColor" stroke-width="1" opacity=".8"/>
        <g fill="none" stroke="currentColor" stroke-width="1.1">
          <path d="M34 30 C28 24 26 16 30 12 C34 16 36 24 34 30 Z"/>
          <path d="M34 30 C40 26 46 24 50 26 C46 30 40 32 34 30 Z"/>
          <path d="M34 30 C32 36 30 42 26 44 C26 38 30 32 34 30 Z"/>
          <path d="M34 30 C36 36 40 40 44 40 C42 34 38 30 34 30 Z"/>
          <circle cx="34" cy="30" r="1.6" fill="currentColor"/>
        </g>
      </svg>
    </div>
    <div class="deco-fan">
      <svg viewBox="0 0 110 72" xmlns="http://www.w3.org/2000/svg">
        <path d="M55 66 L14 14 A52 52 0 0 1 96 14 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <line x1="55" y1="66" x2="30" y2="18" stroke="currentColor" stroke-width="1"/>
        <line x1="55" y1="66" x2="42" y2="12" stroke="currentColor" stroke-width="1"/>
        <line x1="55" y1="66" x2="55" y2="10" stroke="currentColor" stroke-width="1"/>
        <line x1="55" y1="66" x2="68" y2="12" stroke="currentColor" stroke-width="1"/>
        <line x1="55" y1="66" x2="80" y2="18" stroke="currentColor" stroke-width="1"/>
      </svg>
    </div>
    <div class="deco-verse">
      <span>一</span><span>日</span><span>看</span><span>尽</span>
      <i class="deco-dot"></i>
      <span>天</span><span>下</span><span>事</span>
    </div>
    <div class="deco-seal">观</div>
    <div class="deco-cloud">
      <svg viewBox="0 0 90 44" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 34 C4 26 10 22 16 24 C17 16 26 12 33 17 C37 11 47 12 50 19 C57 14 67 18 67 26 C74 25 80 29 80 35" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M14 40 C14 36 18 34 21 36" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M56 40 C56 36 61 34 64 36" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>
  </aside>

  <!-- ⭐ 门户首页主体 -->
  <main class="portal">

    <!-- 顶部标题 -->
    <header class="portal-head">
      <p class="header-seal">热搜</p>
      <h1 class="site-title">今日热搜</h1>
      <p class="site-desc">三分钟，看尽今日人间</p>
    </header>

    <!-- ⭐ 形象图案 + 融合搜索框（核心区）
         图案画的是"一纸报晓"：一轮墨日 + 飞鸟 + 远山，
         寓意"消息随风、传遍四方"。
         搜索框嵌在图案正下方，与图案连成一体 ——
         图案是"信息从远处飞来"，搜索框是"你伸手去接住它"。 -->
    <section class="portal-hero">

      <!-- 图案层（纯 SVG，零图片） -->
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- 墨日的浓淡：中心比第一版淡，边缘散开 -->
            <radialGradient id="heroSun" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#0a0d10" stop-opacity=".58"/>
              <stop offset="55%"  stop-color="#0a0d10" stop-opacity=".38"/>
              <stop offset="80%"  stop-color="#0a0d10" stop-opacity=".14"/>
              <stop offset="100%" stop-color="#0a0d10" stop-opacity="0"/>
            </radialGradient>
            <!-- 远山的淡墨 -->
            <linearGradient id="heroHill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0a0d10" stop-opacity=".30"/>
              <stop offset="100%" stop-color="#0a0d10" stop-opacity=".04"/>
            </linearGradient>
          </defs>

          <!-- 远山：底部两道淡墨 -->
          <path d="M0 200 C70 160 130 185 200 170 C270 155 340 175 400 162 L400 220 L0 220 Z"
                fill="url(#heroHill)"/>
          <path d="M0 210 C90 190 170 205 260 195 C330 188 380 196 400 190 L400 220 L0 220 Z"
                fill="url(#heroHill)"/>

          <!-- 墨日：一轮，微微靠右 -->
          <circle cx="230" cy="88" r="52" fill="url(#heroSun)"/>

          <!-- 飞鸟：三只，象征消息从远处飞来 -->
          <g stroke="#0a0d10" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".8">
            <path d="M70 70 C80 62 92 62 100 70"/>
            <path d="M92 62 C98 66 98 74 100 70"/>
          </g>
          <g stroke="#0a0d10" stroke-width="1.9" fill="none" stroke-linecap="round" opacity=".7">
            <path d="M118 48 C126 42 136 42 142 48"/>
            <path d="M136 42 C140 46 140 52 142 48"/>
          </g>
          <g stroke="#0a0d10" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".55">
            <path d="M155 82 C161 78 169 78 174 82"/>
            <path d="M169 78 C172 81 172 84 174 82"/>
          </g>

          <!-- 几点淡墨飞白，破呆板 -->
          <circle cx="70" cy="130" r="3" fill="#0a0d10" opacity=".10"/>
          <circle cx="320" cy="60" r="4" fill="#0a0d10" opacity=".08"/>
          <circle cx="330" cy="150" r="2.5" fill="#0a0d10" opacity=".10"/>
        </svg>
      </div>

      <!-- 融合搜索框：紧贴图案下方，视觉上"接住"图案 -->
      <div class="hero-search">
        <span class="search-icon">检索</span>
        <input
          type="text"
          id="portalKeyword"
          class="search-input"
          placeholder="搜一个你关心的话题，看它在不在热搜里"
          autocomplete="off">
      </div>

      <!-- 入口按钮 -->
      <div class="hero-actions">
        <a class="portal-btn portal-btn-main" href="hot.html">热点速览</a>
        <a class="portal-btn" href="trend.html">热度趋势分析</a>
      </div>

      <p class="portal-note">当前为<b>示例数据</b> · 非真实平台数据</p>
    </section>

  </main>

  <script src="portal.js?v=12"></script>
</body>
</html>
