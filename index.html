<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Coding 项目 · 作品导航</title>
  <style>
    :root {
      --paper: #f2f3f4;
      --card: #ffffff;
      --ink: #22252a;
      --ink-mid: #4e545c;
      --ink-light: #878e96;
      --cinnabar: #8e1f1a;
      --azurite: #39536b;
      --border: rgba(34, 37, 42, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Songti SC", "SimSun", "Noto Serif SC", "Source Han Serif SC",
                   "STKaiti", "KaiTi", "Microsoft YaHei", serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 24px 72px;
    }
    .seal {
      display: inline-block;
      padding: 4px 10px;
      color: #fff;
      background: var(--cinnabar);
      border-radius: 3px;
      font-size: 12px;
      letter-spacing: 2px;
    }
    h1 {
      margin: 18px 0 6px;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: 4px;
    }
    .meta {
      margin: 0 0 30px;
      color: var(--ink-light);
      font-size: 14px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 22px 24px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(34, 37, 42, .05);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(142, 31, 26, .35);
      box-shadow: 0 6px 18px rgba(34, 37, 42, .09);
    }
    .card .title {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--ink);
    }
    .card .title .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 8px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1px;
      border-radius: 3px;
      vertical-align: 2px;
    }
    .badge.live { color: #fff; background: var(--cinnabar); }
    .badge.todo { color: var(--ink-light); background: rgba(34, 37, 42, .08); }
    .card .desc {
      margin: 6px 0 0;
      font-size: 14px;
      color: var(--ink-mid);
    }
    .card .hint {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--ink-light);
    }
    .foot {
      margin-top: 34px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--ink-light);
      letter-spacing: .5px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="seal">项目</span>
    <h1>Vibe Coding 作品集</h1>
    <p class="meta">作者：惊蛰无声 ｜ GitHub：Qflow1</p>

    <a class="card" href="Hot-search/index.html">
      <span class="title">今日热搜 <span class="badge live">已上线</span></span>
      <p class="desc">三分钟看尽今日人间。门户首页 + 热点速览 + 热度趋势分析。</p>
      <p class="hint">点这里进入 →</p>
    </a>

    <div class="card">
      <span class="title">大学生日程规划网站 <span class="badge todo">建设中</span></span>
      <p class="desc">课表、待办、时间分配。</p>
      <p class="hint">尚未开始，敬请期待。</p>
    </div>

    <div class="card">
      <span class="title">英语综合学习网站 <span class="badge todo">建设中</span></span>
      <p class="desc">词汇、听力、练习。</p>
      <p class="hint">尚未开始，敬请期待。</p>
    </div>

    <p class="foot">28 天 VibeCoding 学习打卡 · 学习过程仓库</p>
  </div>
</body>
</html>
